name: 'Jekyll Deploy Action'
description: >
  🪂  A Github Action to deploy the Jekyll site conveniently for GitHub Pages
inputs:
  docker_hub_username:
    description: Username for Docker Hub
    required: true
  docker_hub_password:
    description: Docker Hub authentication token
    required: true
  docker_hub_token:
    description: Docker Hub authentication token
    required: true
  credentials:
    description: 'The gcloud credentials'
    required: true
  image_name:
    description: "Name for the container to be created. Example: nginx"
    required: true
  image_tag:
    description: Tag to use for the new image
    required: true
  dockerfile_path:
    description: Path to the dockerfile from which to build the image
    required: true
  build_args:
    description: Build args
    required: false
    default: ""
  docker_hub_repo_short_description:
    description: Short description text for the docker hub repo
    required: true
  docker_hub_repo_readme_file_path:
    description: |
      Path of the md file which will be used as the docker hub repo readme
    required: true
  cache_src:
    description: Path for the docker cache source
    required: false
    default: /tmp/.buildx-cache
  cache_dest:
    description: Path for the docker cache destination
    required: false
    default: /tmp/.buildx-cache-new
  provider:
    description: 'The deploy provider'
    required: true
  owner:
    description: 'The deploy owner'
    required: false
  token:
    description: 'The deploy token'
    required: false
  repository:
    description: 'The deploy repository'
    required: false
  branch:
    description: 'The deploy branch'
    required: false
  actor:
    description: 'The github username creating the commit'
    required: false
  cname:
    description: 'The cname to use for the site'
    required: false
  bundler_ver:
    description: 'The Bundler version'
    required: false
  jekyll_baseurl:
    description: 'The Jekyll website baseurl'
    required: false
  pre_build_commands:
    description: 'The pre-build commands'
    required: false

branding:
  icon: 'command'
  color: 'red'

runs:
  #using: 'docker'
  #image: 'Dockerfile'
  using: composite
  steps:
    - name: Login to DockerHub
      if: runner.os == 'Linux'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker_hub_username }}
        password: ${{ inputs.docker_hub_token }} 
        
    - name: 💎 Variables
      if: runner.os != 'Windows'           
      id: variables
      shell: bash
      run: |
        IFS=', '; array=($(curl -L -s 'https://registry.hub.docker.com/v2/repositories/eq19/prime/tags?page_size=1024'|jq -rc '."results"[]["name"]'))
        for ((i=0; i < ${#array[@]}; i++)); do
          if (( $i == 0 )); then echo "IMAGE_TAG=${array[$i]}" >> $GITHUB_ENV; fi
          HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d "{\"username\": \"${{ inputs.docker_hub_username }}\", \"password\": \"${{ inputs.docker_hub_password }}\"}" https://hub.docker.com/v2/users/login/ | jq -r .token)
          curl -i -X DELETE -H "Accept: application/json" -H "Authorization: JWT $HUB_TOKEN" https://hub.docker.com/v2/namespaces/eq19/repositories/prime/tags/${array[$i]}
        done

    - name: Set Docker Hub description
      if: runner.os == 'Windows'
      uses: peter-evans/dockerhub-description@v4
      with:
        repository: 'eq19/prime'
        username: ${{ inputs.docker_hub_username }}
        password: ${{ inputs.docker_hub_token }}
        short-description: ${{ inputs.docker_hub_repo_short_description }}
        readme-filepath: ${{ inputs.docker_hub_repo_readme_file_path }}

    - name: 💎 Rule Settings
      if: runner.os != 'Windows'
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: |
          const { spawnSync } = require( 'child_process' )
          const ls = spawnSync('ls', [ '-al', '/' ] )
          console.log( `stdout: ${ ls.stdout.toString() }` )
